<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HotTips Results
    </title>

    <link
        rel="stylesheet"
        href="./results.css"
    >

</head>

<body>

<main>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="app-header">

        <div class="brand">

            <img
                src="logo.png"
                class="logo"
                alt="HotTips"
            >

            <div class="header-text">

                <h1>
                    HotTips
                </h1>

                <p>
                    Employee Results - Tip Distribution Summary
                </p>

            </div>

        </div>

        <div class="headerButtons no-print">

            <button id="backButton">
                Back
            </button>

            <button id="saveButton">
                Save
            </button>

            <button id="printButton">
                Print Leaderboard
            </button>

            <button id="payrollSummaryButton">
                Export Summary Results
            </button>

            <button id="exportCSVButton">
                Export Stats
            </button>

            <button id="loadButton">
                Load History
            </button>

            <input
                type="file"
                id="historyInput"
                accept=".json"
                hidden
            >

        </div>

    </header>


    <!-- =========================
         DATE SELECTOR
    ========================= -->

    <section id="dateSelector">

    </section>


    <!-- =========================
         RESULTS / STATS / ANALYTICS
    ========================= -->

    <div class="view-area">


        <!-- =========================
             VIEW TOGGLE
        ========================= -->

        <div class="view-toggle no-print">

            <button
                id="resultsButton"
                class="active"
                type="button"
            >
                Summary Results
            </button>

            <button
                id="summaryButton"
                type="button"
            >
                Stats
            </button>

            <button
                id="analyticsButton"
                type="button"
            >
                Analytics
            </button>

        </div>


        <!-- =========================
             RESULTS VIEW
        ========================= -->

        <section id="resultsView">

            <section id="resultsContainer">

            </section>

            <section id="employeeDetails">

            </section>

        </section>


        <!-- =========================
             STATS VIEW
        ========================= -->

        <section
            id="statsView"
            style="display:none;"
        >

            <section id="statsContainer">

            </section>

        </section>


        <!-- =========================
             ANALYTICS VIEW
        ========================= -->

        <section
            id="analyticsView"
            style="display:none;"
        >

            <section id="analyticsContainer">

            </section>

        </section>


    </div>


    <!-- =========================
         PRINT SUMMARY
    ========================= -->

    <section id="printSummary">

    </section>


</main>


<script
    type="module"
    src="./app.js"
></script>

</body>

</html>
