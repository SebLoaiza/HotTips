<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HotTips Results
    </title>


    <link
        rel="stylesheet"
        href="./results.css"
    >

</head>


<body>


<main>


<header class="app-header">

    <div class="brand">

        <img
            src="logo.png"
            class="logo"
        >

        <div class="header-text">

            <h1>
                HotTips
            </h1>

            <p>
                Employee Results - Tip Distribution Summary
            </p>

        </div>

    </div>


    <div class="headerButtons">

        <button id="backButton">
            Back
        </button>

        <button id="printButton">
            Print Summary
        </button>

        <button id="exportCSVButton">
            Export CSV
        </button>

        <button id="saveButton">
            Save History
        </button>

        <button id="payrollSummaryButton">
            Payroll Summary
        </button>

        <button id="loadButton">
            Load History
        </button>

        <input
            type="file"
            id="historyInput"
            accept=".json"
            hidden
        >

    </div>

</header>





<section id="dateSelector">

</section>





<section id="printSummary">

</section>





<section id="resultsContainer">

</section>





<section id="employeeDetails">

</section>





</main>





<script
    type="module"
    src="./app.js"
></script>



</body>

</html>
