<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HotTips Results
    </title>


    <link
        rel="stylesheet"
        href="./results.css"
    >

</head>


<body>


<main>


<header class="app-header">


    <div class="header-title">

        <h1>
            Employee Results
        </h1>

        <p>
            Tip distribution summary and payroll breakdown
        </p>

    </div>




    <div class="headerButtons">


        <button id="backButton">
            Back
        </button>



        <button id="printButton">
            Print Summary
        </button>



        <button id="exportCSVButton">
            Export CSV
        </button>



        <button id="saveButton">
            Save History
        </button>



        <button id="payrollSummaryButton">
            Payroll Summary
        </button>



        <button id="loadButton">
            Load History
        </button>



        <input
            type="file"
            id="historyInput"
            accept=".json"
            hidden
        >


    </div>


</header>





<section id="dateSelector">

</section>





<section id="printSummary">

</section>





<section id="resultsContainer">

</section>





<section id="employeeDetails">

</section>





</main>





<script
    type="module"
    src="./app.js"
></script>



</body>

</html>
