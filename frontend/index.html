<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Distribution Tool</title>

    <link rel="stylesheet" href="/static/style.css">
</head>


<body>

    <h1>Tip Distribution Tool</h1>


    <h2>Upload Shifts CSV</h2>

    <input
        type="file"
        id="shiftCsv"
        accept=".csv"
    >
    <h2>Orders CSV</h2>

    <input
        type="file"
        id="orderCsv"
        accept=".csv"

    />



    <h1>Tip Tables</h1>

    <div id="tipTables"></div>

    <div id="output"></div>
    
    <hr>




    <h1>Assigned Employees</h1>

<div id="assignedMeals"></div>



    <h2>Meal Participations</h2>

<div id="participations"></div>


<hr>



<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="module" src="/static/src/app.js"></script>


</body>

</html>
