<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HotTips - Tip Distribution
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

<header class="app-header">

    <img
        src="logo.png"
        class="logo"
        alt="HotTips Logo"
    >

    <div class="header-text">

        <h1>
            HotTips
        </h1>

        <p>
            Tip Distribution Workflow
        </p>

    </div>

</header>


<main>

<!-- =========================================================
     PROCESS NAVIGATION
========================================================= -->

<section class="panel workflow">

    <button
        id="backButton"
        class="nav-button"
        type="button"
    >
        ← Back
    </button>


    <div class="steps">

        <button
            class="step active"
            data-tab="inputTab"
            type="button"
        >
            1. Cash Drop Entry
        </button>

        <button
            class="step"
            data-tab="employeeTab"
            type="button"
        >
            2. Employee Config
        </button>

        <button
            class="step"
            data-tab="pointsTab"
            type="button"
        >
            3. Employee Tip Points
        </button>

        <button
            class="step"
            data-tab="summaryTab"
            type="button"
        >
            4. Summary
        </button>

    </div>


    <button
        id="continueButton"
        class="nav-button"
        type="button"
    >
        Continue →
    </button>

</section>


<!-- =========================================================
     INPUTS — TAB 1
========================================================= -->

<section
    id="inputTab"
    class="tab-page active"
>

    <section class="panel">

        <h2>
            Cash Drop Entry
        </h2>

        <p class="page-description">
            Enter the amount of cash each employee turned in.
        </p>


        <!-- =================================================
             CASH DROP ACTION BUTTONS
        ================================================= -->

        <div
            id="cashDropControls"
            class="cash-drop-controls"
        >
        </div>


        <!-- =================================================
             TIP TOTALS
        ================================================= -->

        <div class="tip-totals">


            <!-- CREDIT CARD TIPS -->

            <div class="tip-total-card credit-card-tips">

                <span class="tip-total-label">
                    Total Credit Card Tips
                </span>

                <strong
                    id="totalCreditCardTips"
                    class="tip-total-value"
                >
                    $0.00
                </strong>

            </div>


            <!-- CASH TIP CALCULATION -->

            <div class="tip-total-card cash-tips-card">

                <span class="tip-total-label">
                    Cash Tip Calculation
                </span>


                <div class="cash-tip-calculation">


                    <!-- TOTAL CASH DROP -->

                    <div class="cash-tip-number">

                        <span class="cash-tip-subtitle">
                            Total Cash Drop
                        </span>

                        <strong id="totalCashDrop">
                            $0.00
                        </strong>

                    </div>


                    <!-- MINUS -->

                    <span class="cash-tip-operator">
                        −
                    </span>


                    <!-- TOTAL CASH SALES -->

                    <div class="cash-tip-number">

                        <span class="cash-tip-subtitle">
                            Total Cash Sales
                        </span>

                        <strong id="totalCashSales">
                            $0.00
                        </strong>

                    </div>


                    <!-- EQUALS -->

                    <span class="cash-tip-operator">
                        =
                    </span>


                    <!-- TOTAL CASH TIPS -->

                    <div class="cash-tip-number cash-tip-result">

                        <span class="cash-tip-subtitle">
                            Total Cash Tips
                        </span>

                        <strong id="totalCashTips">
                            $0.00
                        </strong>

                    </div>


                </div>

            </div>


        </div>


        <!-- =================================================
             CASH DROP TABLES
        ================================================= -->

        <div
            id="cashDropTables"
        ></div>


    </section>

</section>


<!-- =========================================================
     EMPLOYEE CONFIG — TAB 2
========================================================= -->

<section
    id="employeeTab"
    class="tab-page"
>

    <section class="config-section trainee-config">

        <h2>
            Trainee Assignments
        </h2>

        <div id="traineeAssignments"></div>

    </section>

</section>


<!-- =========================================================
     EMPLOYEE TIP POINTS — TAB 3
========================================================= -->

<section
    id="pointsTab"
    class="tab-page"
>

    <section class="config-section points-config">

        <h2>
            Employee Tip Points
        </h2>

        <div id="employeePoints"></div>

    </section>

</section>


<!-- =========================================================
     SUMMARY — TAB 4
========================================================= -->

<section
    id="summaryTab"
    class="tab-page"
>

    <section class="panel">

        <h2>
            Final Summary
        </h2>

        <div id="cashTipSummary"></div>

    </section>

</section>


</main>


<script
    type="module"
    src="./tabs.js"
></script>


<script
    type="module"
    src="./app.js"
></script>


</body>

</html>
