<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
HotTips - Tip Distribution
</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>


<header class="app-header">


    <img
        src="logo.png"
        class="logo"
    >


    <div class="header-text">

        <h1>
            HotTips
        </h1>

        <p>
            Tip Distribution Workflow
        </p>

    </div>


</header>




<main>



<!-- =========================
     PROCESS NAVIGATION
========================= -->


<section class="panel workflow">


    <button
        id="backButton"
        class="nav-button"
    >
        ← Back
    </button>




    <div class="steps">


        <button
            class="step active"
            data-tab="inputTab"
        >

            1.
            Inputs

        </button>



        <button
            class="step"
            data-tab="employeeTab"
        >

            2.
            Employee Config

        </button>



        <button
            class="step"
            data-tab="summaryTab"
        >

            3.
            Summary

        </button>


    </div>




    <button
        id="continueButton"
        class="nav-button"
    >

        Continue →

    </button>



</section>






<!-- =========================
     INPUTS
========================= -->


<section
id="inputTab"
class="tab-page active"
>


<section class="panel">


<h2>
Cash Drop Entry
</h2>


<p>

Enter the amount of cash each employee turned in.

</p>


<div id="cashDropTables"></div>


</section>





<section class="panel">


<h2>
Card Tips
</h2>


<p>

Review calculated card tips.

</p>


<div id="cardSalesTables"></div>


</section>


</section>







<!-- =========================
     EMPLOYEE CONFIG
========================= -->


<section
id="employeeTab"
class="tab-page"
>


<div class="config-grid">



<section class="panel">


<h2>
Employee Tip Points
</h2>


<div id="employeePoints"></div>


</section>




<section class="panel">


<h2>
Trainee Assignments
</h2>


<div id="traineeAssignments"></div>


</section>



</div>


</section>







<!-- =========================
     SUMMARY
========================= -->


<section
id="summaryTab"
class="tab-page"
>


<section class="panel">


<h2>
Final Summary
</h2>


<div id="cashTipSummary"></div>


</section>


</section>





</main>



<script type="module" src="./tabs.js"></script>
<script type="module" src="./app.js"></script>


</body>

</html>
