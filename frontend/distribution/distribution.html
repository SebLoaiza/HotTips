<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HotTips - Tip Distribution
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<header class="app-header">


    <!-- =================================================
         HEADER BRAND
    ================================================== -->

    <div class="header-brand">


        <a
            href="../start/start.html"
            class="logo-button"
            aria-label="Go to HotTips start page"
        >

            <img
                src="logo.png"
                class="logo"
                alt="HotTips"
            >

        </a>


        <div class="header-text">

            <h1>
                HotTips
            </h1>

            <p>
                Tip Distribution
            </p>

        </div>


    </div>



    <!-- =================================================
         TOP NAVIGATION
    ================================================== -->

    <nav class="top-navigation">


        <button
            id="topBackButton"
            class="nav-button back-button"
            type="button"
        >

            ← Back

        </button>



        <button
            id="topContinueButton"
            class="nav-button continue-button"
            type="button"
        >

            Continue →

        </button>


    </nav>


</header>



<!-- =================================================
     MAIN
================================================== -->

<main>


    <!-- =================================================
         TIP DISTRIBUTION
    ================================================== -->

    <section class="panel process-panel">


        <div class="section-heading">


            <div>

                <h2>
                    Tip Distribution
                </h2>


                <p class="page-description">

                    Review each meal block, verify employee
                    distributions, and calculate final payouts.

                </p>

            </div>


        </div>


        <!-- =================================================
             DISTRIBUTION TOTALS
        ================================================== -->

        <div class="distribution-totals">


            <!-- =================================================
                 CASH AVAILABLE
            ================================================== -->

            <div class="distribution-total-card">

                <span class="distribution-total-label">

                    Total Drop Minus Sales

                </span>


                <strong
                    id="originalCashTips"
                    class="distribution-total-value"
                >

                    $0.00

                </strong>

            </div>



            <!-- =================================================
                 CASH DISTRIBUTED
            ================================================== -->

            <div class="distribution-total-card">

                <span class="distribution-total-label">

                    Cash Tips Distributed

                </span>


                <strong
                    id="totalCashDistributed"
                    class="distribution-total-value"
                >

                    $0.00

                </strong>

            </div>



            <!-- =================================================
                 CARD TIPS
            ================================================== -->

            <div class="distribution-total-card">

                <span class="distribution-total-label">

                    Toast Credit Card Tips EX. Fee

                </span>


                <strong
                    id="originalCardTips"
                    class="distribution-total-value"
                >

                    $0.00

                </strong>

            </div>



            <!-- =================================================
                 CARD DISTRIBUTED
            ================================================== -->

            <div class="distribution-total-card">

                <span class="distribution-total-label">

                    Credit Card Tips Ex. Fees Distributed

                </span>


                <strong
                    id="totalCardDistributed"
                    class="distribution-total-value"
                >

                    $0.00

                </strong>

            </div>


        </div>


    </section>



    <!-- =================================================
         DAY TABS / MEAL BLOCKS
    ================================================== -->

    <section class="panel distribution-panel">


        <!-- =================================================
             DAY TABS
        ================================================== -->

        <div
            id="dayTabs"
            class="day-tabs"
        >

            <!-- Day tabs render here -->

        </div>



        <!-- =================================================
             DISTRIBUTION TABLES
        ================================================== -->

        <div
            id="distributionTables"
        >

            <!-- Meal blocks render here -->

        </div>


    </section>





<!-- =================================================
     FOOTER
================================================== -->

<footer>

    HotTips • Tip Distribution

</footer>



<!-- =================================================
     APPLICATION
================================================== -->

<script
    type="module"
    src="./app.js"
></script>


</body>

</html>
