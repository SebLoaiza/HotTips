<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Final Tip Results</title>

    <link rel="stylesheet" href="/static/dist/css/styles.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .summary {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .buttons {
            margin-bottom: 25px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Final Tip Distribution</h1>

    <div class="buttons">
        <button onclick="window.history.back()">← Back</button>
    </div>

    <div class="summary">
        <div><b>Total Employees:</b> <span id="employeeCount">0</span></div>
        <div><b>Total Card:</b> $<span id="cardTotal">0.00</span></div>
        <div><b>Total Cash:</b> $<span id="cashTotal">0.00</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Employee</th>
                <th>Card Total</th>
                <th>Cash Total</th>
            </tr>
        </thead>

        <tbody id="resultsBody">

        </tbody>
    </table>

    <script src="js/results.js"></script>

</body>

</html>
