<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toast Inputs</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>


<header class="app-header">

    <img 
        src="logo.png" 
        class="logo"
    >


    <div class="header-text">

        <h1>
            HotTips
        </h1>

        <p>
            Toast Inputs
        </p>

    </div>

</header>





<main>



<section class="panel process-panel">


    <h2>
        Toast Inputs
    </h2>


    <p class="page-description">

        Upload your shift, order, and payment CSV files to automatically
        calculate employee tips, cash collected, and daily tip distribution.

    </p>





    <div class="process-flow">



        <div 
            class="upload-card process-step" 
            id="shiftCard"
        >


            <label for="shiftCsv">
                Shift CSV
            </label>


            <input
                id="shiftCsv"
                type="file"
                accept=".csv"
            >


        </div>





        <div 
            class="upload-card process-step" 
            id="orderCard"
        >


            <label for="orderCsv">
                Order CSV
            </label>


            <input
                id="orderCsv"
                type="file"
                accept=".csv"
            >


        </div>





        <div 
            class="upload-card process-step" 
            id="paymentCard"
        >


            <label for="paymentCsv">
                Payment CSV
            </label>


            <input
                id="paymentCsv"
                type="file"
                accept=".csv"
            >


        </div>







        <div 
            class="continue-step" 
            id="continueStep"
        >


            <button
                id="nextPage"
                disabled
            >
                Continue →
            </button>




            <button
                id="resetProcess"
                class="danger-button reset-button"
            >
                Reset
            </button>



        </div>




    </div>


</section>









<section class="panel results-panel">





    <div 
        class="report-column"
    >


        <h3>
            Card Tips
        </h3>


        <div id="cardSalesTables">

            <!-- Card tip tables render here -->

        </div>


    </div>







    <div 
        class="report-column"
    >


        <h3>
            Cash Collection
        </h3>


        <div id="cashCollectedTables">

            <!-- Cash tables render here -->

        </div>


    </div>





</section>









<section class="debug-panel">


    <button 
        id="debugObjects"
    >

        Debug Objects

    </button>




    <pre id="debugOutput"></pre>



</section>






</main>






<footer>

    HotTips • Toast Inputs

</footer>







<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


<script type="module" src="./app.js"></script>



</body>

</html>
